- name: Personal Server Project # Project name, also used as heading
  id: p3 # Project id, must be unique amongst the projects
  img_src: /assets/img/website.jpg # Optional image
  description_less: Hosting web apps and services from my living room. # Description shown at all times, text only
  description_more: > # Description shown only when the project card is expanded, HTML only
    <p>Built and deployed a self-hosted infrastructure running multiple containerized services accessible from anywhere on the internet through secure reverse proxy configuration. <br><br> The system hosts media streaming, game servers, and websites using Docker containers, SSH remote management, and CloudFlare DNS routing - all running headless on Ubuntu Server from my home network. <br><br> This eliminated monthly subscription costs while providing hands-on experience with enterprise server administration, networking security, and containerized service deployment.</p>
  action_buttons: > # Action buttons for project, HTML only
